<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCIGA App — Hors ligne</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0f2d52;
    color: #ffffff;
    font-family: -apple-system, Roboto, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 360px;
    padding: 32px 24px;
    text-align: center;
  }
  .logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    object-fit: contain;
    display: block;
    margin: 0 auto 20px auto;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 8px 0;
  }
  p {
    font-size: 14px;
    color: #c7d0de;
    line-height: 1.5;
    margin: 0 0 24px 0;
  }
  button {
    background: #c99a2e;
    color: #0f2d52;
    border: none;
    border-radius: 8px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="branding/CCIGA_App_Icon.png" alt="Logo CCIGA" />
    <h1>Pas de connexion Internet</h1>
    <p>CCIGA App a besoin d'une connexion Internet pour afficher le contenu. Vérifiez votre connexion Wi-Fi ou mobile, puis réessayez.</p>
    <button onclick="location.href='https://cciga-app.vercel.app'">Réessayer</button>
  </div>
</body>
</html>
