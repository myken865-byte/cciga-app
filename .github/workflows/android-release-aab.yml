name: Build Android Release AAB (signed)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Signing material is written from GitHub Actions secrets only, never
      # committed, never echoed. GitHub automatically redacts any secret
      # value that appears in logs, but no step here prints these anyway.
      - name: Write Release signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing one or more required signing secrets (ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/cciga-release.keystore
          cat > android/keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=cciga-release.keystore
          EOF

      - name: Clean build Release AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --no-daemon

      - name: Remove signing material from disk (defense in depth)
        if: always()
        run: |
          rm -f android/app/cciga-release.keystore android/keystore.properties

      - name: Download bundletool (public Google release, no auth)
        run: curl -sL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

      - name: Verify AAB (metadata, signing, no DEV/TEST leakage)
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          echo "--- SHA-256 ---"
          sha256sum "$AAB"
          echo "--- Size ---"
          ls -la "$AAB"
          echo "--- Manifest: applicationId / versionCode / versionName / targetSdk / compileSdk ---"
          java -jar bundletool.jar dump manifest --bundle="$AAB" | grep -E "package=|versionCode=|versionName=|targetSdkVersion|minSdkVersion|compileSdkVersion"
          echo "--- Signing certificate (public info only, jarsigner — AABs are jar-signed, not apksigner-signed) ---"
          jarsigner -verify -verbose -certs "$AAB" | grep -E "^(sm|s|m| |jar verified|CN=)" | head -30
          echo "--- Confirm no DEV/TEST devtest URL leaked into the bundle ---"
          if unzip -p "$AAB" | strings | grep -q "cciga-app-devtest.vercel.app"; then
            echo "::error::devtest URL found in Release AAB — build must not ship with this."
            exit 1
          else
            echo "OK — no devtest URL present in the Release AAB."
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: cciga-app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
