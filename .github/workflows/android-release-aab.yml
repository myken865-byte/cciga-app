name: Build Android Release AAB (signed)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # Mandat "Automatisation Google Play" (2026-09-07), §6.2-3 et §20 :
      # aucun AAB défectueux ne doit être produit — lint et tests bloquent
      # le build (le job échoue ici, avant tout accès aux secrets de
      # signature) plutôt que de laisser passer un bundle non vérifié.
      - name: Lint (STOP — build non autorisé si erreur)
        run: npm run lint

      - name: Automated tests (STOP — build non autorisé si échec)
        run: npm run test

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Signing material is written from GitHub Actions secrets only, never
      # committed, never echoed. GitHub automatically redacts any secret
      # value that appears in logs, but no step here prints these anyway.
      - name: Write Release signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing one or more required signing secrets (ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/cciga-release.keystore
          cat > android/keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=cciga-release.keystore
          EOF

      - name: Clean build Release AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --no-daemon

      - name: Remove signing material from disk (defense in depth)
        if: always()
        run: |
          rm -f android/app/cciga-release.keystore android/keystore.properties

      - name: Download bundletool (public Google release, no auth)
        run: curl -sL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

      - name: Verify AAB (metadata, signing, no DEV/TEST leakage)
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          echo "--- SHA-256 ---"
          sha256sum "$AAB"
          echo "--- Size ---"
          ls -la "$AAB"
          echo "--- Manifest: applicationId / versionCode / versionName / targetSdk / compileSdk ---"
          java -jar bundletool.jar dump manifest --bundle="$AAB" | grep -E "package=|versionCode=|versionName=|targetSdkVersion|minSdkVersion|compileSdkVersion"
          echo "--- Signing certificate (public info only, jarsigner — AABs are jar-signed, not apksigner-signed) ---"
          # Bug corrigé (2026-09-08) : l'ancien grep ne filtrait que la
          # légende de jarsigner ("s = signature was verified"), jamais le
          # verdict réel — un AAB non signé passait silencieusement (c'est
          # ce qui a causé le rejet Google Play "must be signed" sur le
          # premier essai d'upload). Vérifié empiriquement : le code de
          # sortie de jarsigner reste 0 même sur un jar totalement non
          # signé (y compris avec -strict) — seul le texte du verdict fait
          # foi ici, jamais le code de sortie seul.
          jarsigner -verify -strict "$AAB" > jarsigner-verify.log 2>&1 || true
          cat jarsigner-verify.log
          if grep -qE "jar is unsigned|no manifest" jarsigner-verify.log; then
            echo "::error::jarsigner signale un bundle non signé — upload/release refusé."
            exit 1
          fi
          if ! grep -q "jar verified" jarsigner-verify.log; then
            echo "::error::jarsigner n'a pas confirmé « jar verified » — bundle traité comme non signé par prudence."
            exit 1
          fi
          echo "--- Détail du certificat (information publique uniquement) ---"
          jarsigner -verify -verbose -certs "$AAB" | grep -E "^(sm|s|m| |jar verified|CN=)" | head -30
          # Mandat "Option 2 confirmée : DEVTEST/PREPROD" (2026-09-08) : ce
          # contrôle vérifiait auparavant l'ABSENCE d'une URL devtest —
          # protection contre un oubli accidentel uniquement. capacitor.config.ts
          # peut désormais pointer délibérément vers DEVTEST le temps que
          # Production soit redéployée (voir docs/ANDROID_RELEASE_CONFIG.md
          # §9) : le contrôle confirme maintenant que l'URL réellement
          # embarquée dans l'AAB correspond EXACTEMENT à celle committée dans
          # capacitor.config.ts, quelle que soit sa valeur — protège contre
          # une dérive silencieuse dans les deux sens (Production ou DEVTEST).
          echo "--- Confirm bundled server URL matches capacitor.config.ts exactly ---"
          EXPECTED_URL=$(grep -oP "url:\s*'\K[^']+" capacitor.config.ts)
          if [ -z "$EXPECTED_URL" ]; then
            echo "::error::Impossible d'extraire server.url depuis capacitor.config.ts — build refusé."
            exit 1
          fi
          echo "URL attendue (capacitor.config.ts) : $EXPECTED_URL"
          ACTUAL_URL=$(python3 -c "import json,zipfile; z=zipfile.ZipFile('$AAB'); print(json.loads(z.read('base/assets/capacitor.config.json'))['server']['url'])" 2>/dev/null || true)
          if [ -z "$ACTUAL_URL" ]; then
            echo "::error::Impossible de lire server.url depuis capacitor.config.json embarqué dans l'AAB — build refusé."
            exit 1
          fi
          echo "URL embarquée (AAB, base/assets/capacitor.config.json) : $ACTUAL_URL"
          if [ "$EXPECTED_URL" != "$ACTUAL_URL" ]; then
            echo "::error::L'AAB embarque '$ACTUAL_URL' mais capacitor.config.ts déclare '$EXPECTED_URL' — build refusé (source et artifact incohérents)."
            exit 1
          fi
          echo "OK — l'AAB pointe exactement vers l'URL committée ($EXPECTED_URL)."

      # Mandat "Automatisation Google Play" (2026-09-07), §6.7-9, §7, §20 :
      # ne pas se contenter d'afficher package/versionCode, les valider
      # explicitement. LAST_UPLOADED_VERSION_CODE doit être mis à jour à la
      # main dans docs/ANDROID_VERSION_HISTORY.md (source de vérité) à
      # chaque nouvel upload réel vers Google Play — jamais automatiquement,
      # pour ne jamais valider silencieusement une régression de version.
      - name: Validate package identity and versionCode uniqueness
        env:
          LAST_UPLOADED_VERSION_CODE: 3
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          DUMP=$(java -jar bundletool.jar dump manifest --bundle="$AAB")
          PACKAGE=$(echo "$DUMP" | grep -oP 'package="\K[^"]+')
          VERSION_CODE=$(echo "$DUMP" | grep -oP 'versionCode="\K[0-9]+')
          echo "Package: $PACKAGE — versionCode: $VERSION_CODE"
          if [ "$PACKAGE" != "ht.cciga.app" ]; then
            echo "::error::Package attendu ht.cciga.app, trouvé $PACKAGE — build refusé."
            exit 1
          fi
          if [ "$VERSION_CODE" -le "$LAST_UPLOADED_VERSION_CODE" ]; then
            echo "::error::versionCode $VERSION_CODE <= dernier versionCode connu ($LAST_UPLOADED_VERSION_CODE, voir docs/ANDROID_VERSION_HISTORY.md). Incrémenter android/app/build.gradle avant de relancer."
            exit 1
          fi
          echo "OK — package et versionCode valides pour un nouvel upload."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: cciga-app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
