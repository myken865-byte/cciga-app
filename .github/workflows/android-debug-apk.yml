name: Build Android debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Clean build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --no-daemon

      - name: Verify APK (signature, alignment, package id)
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          if [ ! -d "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          fi
          "$BUILD_TOOLS/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/zipalign" -c -v 4 android/app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/aapt2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cciga-app-debug-signed-sdk34
          path: android/app/build/outputs/apk/debug/app-debug.apk
