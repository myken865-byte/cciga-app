name: Upload AAB to Google Play — Internal Test

# Mandat "Autorisation Phase Internal Test" (2026-09-08). Workflow séparé,
# dédié uniquement à l'upload Internal Test — android-release-aab.yml et
# google-play-oidc-check.yml restent inchangés (NO REDO). Les étapes de
# build/signature/vérification ci-dessous reprennent à l'identique celles
# déjà validées dans android-release-aab.yml (même recette éprouvée, pas
# redéveloppée) ; seules les étapes d'authentification OIDC et d'upload
# sont nouvelles.
#
# Cible exclusive : Internal Test. Ne jamais toucher Closed Test, Open
# Test ou Production depuis ce fichier.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — restrict to this exact repository
        if: github.repository != 'myken865-byte/cciga-app'
        run: |
          echo "::error::This workflow must only run from myken865-byte/cciga-app — refusing."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Lint (STOP — build non autorisé si erreur)
        run: npm run lint

      - name: Automated tests (STOP — build non autorisé si échec)
        run: npm run test

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Write Release signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing one or more required signing secrets (ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/cciga-release.keystore
          cat > android/keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=cciga-release.keystore
          EOF

      - name: Clean build Release AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean bundleRelease --no-daemon

      - name: Remove signing material from disk (defense in depth)
        if: always()
        run: |
          rm -f android/app/cciga-release.keystore android/keystore.properties

      - name: Download bundletool (public Google release, no auth)
        run: curl -sL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar

      - name: Verify AAB (metadata, signing, no DEV/TEST leakage)
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          echo "--- SHA-256 ---"
          sha256sum "$AAB"
          echo "--- Size ---"
          ls -la "$AAB"
          echo "--- Manifest: applicationId / versionCode / versionName / targetSdk / compileSdk ---"
          java -jar bundletool.jar dump manifest --bundle="$AAB" | grep -E "package=|versionCode=|versionName=|targetSdkVersion|minSdkVersion|compileSdkVersion"
          echo "--- Signing certificate (public info only, jarsigner — AABs are jar-signed, not apksigner-signed) ---"
          # Bug corrigé (2026-09-08) : l'ancien grep ne filtrait que la
          # légende de jarsigner ("s = signature was verified"), jamais le
          # verdict réel — un AAB non signé passait silencieusement (c'est
          # ce qui a causé le rejet Google Play "must be signed" sur le
          # premier essai d'upload). Vérifié empiriquement : le code de
          # sortie de jarsigner reste 0 même sur un jar totalement non
          # signé (y compris avec -strict) — seul le texte du verdict fait
          # foi ici, jamais le code de sortie seul.
          jarsigner -verify -strict "$AAB" > jarsigner-verify.log 2>&1 || true
          cat jarsigner-verify.log
          if grep -qE "jar is unsigned|no manifest" jarsigner-verify.log; then
            echo "::error::jarsigner signale un bundle non signé — upload/release refusé."
            exit 1
          fi
          if ! grep -q "jar verified" jarsigner-verify.log; then
            echo "::error::jarsigner n'a pas confirmé « jar verified » — bundle traité comme non signé par prudence."
            exit 1
          fi
          cat jarsigner-verify.log
          echo "--- Détail du certificat (information publique uniquement) ---"
          jarsigner -verify -verbose -certs "$AAB" | grep -E "^(sm|s|m| |jar verified|CN=)" | head -30
          # Mandat "Option 2 confirmée : DEVTEST/PREPROD" (2026-09-08) : ce
          # contrôle vérifiait auparavant l'ABSENCE d'une URL devtest —
          # protection contre un oubli accidentel uniquement. capacitor.config.ts
          # peut désormais pointer délibérément vers DEVTEST le temps que
          # Production soit redéployée (voir docs/ANDROID_RELEASE_CONFIG.md
          # §9) : le contrôle confirme maintenant que l'URL réellement
          # embarquée dans l'AAB correspond EXACTEMENT à celle committée dans
          # capacitor.config.ts, quelle que soit sa valeur — protège contre
          # une dérive silencieuse dans les deux sens (Production ou DEVTEST).
          echo "--- Confirm bundled server URL matches capacitor.config.ts exactly ---"
          EXPECTED_URL=$(grep -oP "url:\s*'\K[^']+" capacitor.config.ts)
          if [ -z "$EXPECTED_URL" ]; then
            echo "::error::Impossible d'extraire server.url depuis capacitor.config.ts — upload refusé."
            exit 1
          fi
          echo "URL attendue (capacitor.config.ts) : $EXPECTED_URL"
          ACTUAL_URL=$(python3 -c "import json,zipfile; z=zipfile.ZipFile('$AAB'); print(json.loads(z.read('base/assets/capacitor.config.json'))['server']['url'])" 2>/dev/null || true)
          if [ -z "$ACTUAL_URL" ]; then
            echo "::error::Impossible de lire server.url depuis capacitor.config.json embarqué dans l'AAB — upload refusé."
            exit 1
          fi
          echo "URL embarquée (AAB, base/assets/capacitor.config.json) : $ACTUAL_URL"
          if [ "$EXPECTED_URL" != "$ACTUAL_URL" ]; then
            echo "::error::L'AAB embarque '$ACTUAL_URL' mais capacitor.config.ts déclare '$EXPECTED_URL' — upload refusé (source et artifact incohérents)."
            exit 1
          fi
          echo "OK — l'AAB pointe exactement vers l'URL committée ($EXPECTED_URL)."

      # LAST_UPLOADED_VERSION_CODE : même règle que android-release-aab.yml,
      # mis à jour à la main dans docs/ANDROID_VERSION_HISTORY.md uniquement
      # après un upload réel confirmé.
      - name: Validate package identity and versionCode uniqueness
        id: validate
        env:
          LAST_UPLOADED_VERSION_CODE: 4
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          DUMP=$(java -jar bundletool.jar dump manifest --bundle="$AAB")
          PACKAGE=$(echo "$DUMP" | grep -oP 'package="\K[^"]+')
          VERSION_CODE=$(echo "$DUMP" | grep -oP 'versionCode="\K[0-9]+')
          VERSION_NAME=$(echo "$DUMP" | grep -oP 'versionName="\K[^"]+')
          echo "Package: $PACKAGE — versionCode: $VERSION_CODE — versionName: $VERSION_NAME"
          if [ "$PACKAGE" != "ht.cciga.app" ]; then
            echo "::error::Package attendu ht.cciga.app, trouvé $PACKAGE — upload refusé."
            exit 1
          fi
          if [ "$VERSION_CODE" -le "$LAST_UPLOADED_VERSION_CODE" ]; then
            echo "::error::versionCode $VERSION_CODE <= dernier versionCode connu ($LAST_UPLOADED_VERSION_CODE, voir docs/ANDROID_VERSION_HISTORY.md). Incrémenter android/app/build.gradle avant de relancer."
            exit 1
          fi
          echo "OK — package et versionCode valides pour un nouvel upload."
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud via Workload Identity Federation
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/575161100644/locations/global/workloadIdentityPools/cciga-github-actions/providers/cciga-github-actions
          service_account: cciga-google-play-automation@automatic-curve-508002-k3.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      # Séquence Android Publisher API standard : create edit -> upload
      # bundle -> assign to track -> commit. N'importe quel échec avant le
      # commit final abandonne l'edit (aucune trace, aucun impact) plutôt
      # que de laisser un brouillon incomplet trainer.
      - name: Upload AAB to Google Play Internal Test track
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION_CODE: ${{ steps.validate.outputs.version_code }}
          VERSION_NAME: ${{ steps.validate.outputs.version_name }}
        run: |
          set -e
          PACKAGE="ht.cciga.app"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE"

          abandon_edit() {
            if [ -n "${EDIT_ID:-}" ]; then
              echo "Abandon de l'edit $EDIT_ID (échec avant commit — aucune trace laissée)…"
              curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "$API/edits/$EDIT_ID" || true
            fi
          }
          trap abandon_edit ERR

          echo "1/4 — Création de l'edit…"
          EDIT_RESPONSE=$(curl -sS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" "$API/edits")
          echo "$EDIT_RESPONSE"
          EDIT_ID=$(echo "$EDIT_RESPONSE" | grep -oP '"id"\s*:\s*"\K[^"]+')
          if [ -z "$EDIT_ID" ]; then echo "::error::Pas d'editId — arrêt."; exit 1; fi
          echo "Edit: $EDIT_ID"

          echo "2/4 — Upload du bundle ($AAB)…"
          LOCAL_SIZE=$(wc -c < "$AAB")
          echo "Taille locale du fichier : $LOCAL_SIZE octets"
          UPLOAD_OUT=$(curl -sS -w "\n%{http_code}\n%{size_upload}" -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$AAB" \
            "https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/$PACKAGE/edits/$EDIT_ID/bundles?uploadType=media")
          UPLOAD_HTTP_CODE=$(echo "$UPLOAD_OUT" | tail -2 | head -1)
          UPLOAD_BYTES_SENT=$(echo "$UPLOAD_OUT" | tail -1)
          UPLOAD_RESPONSE=$(echo "$UPLOAD_OUT" | sed '$d' | sed '$d')
          echo "HTTP $UPLOAD_HTTP_CODE — octets envoyés par curl : $UPLOAD_BYTES_SENT (attendu : $LOCAL_SIZE)"
          echo "$UPLOAD_RESPONSE"
          if [ "$UPLOAD_BYTES_SENT" != "$LOCAL_SIZE" ]; then
            echo "::error::Upload tronqué — curl n'a envoyé que $UPLOAD_BYTES_SENT/$LOCAL_SIZE octets."
            exit 1
          fi
          UPLOADED_CODE=$(echo "$UPLOAD_RESPONSE" | grep -oP '"versionCode"\s*:\s*\K[0-9]+')
          if [ "$UPLOADED_CODE" != "$VERSION_CODE" ]; then
            echo "::error::versionCode uploadé ($UPLOADED_CODE) différent de celui attendu ($VERSION_CODE)."
            exit 1
          fi
          echo "Bundle uploadé, versionCode confirmé : $UPLOADED_CODE"

          echo "3/4 — Affectation au track Internal Test…"
          TRACK_RESPONSE=$(curl -sS -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"releases\":[{\"versionCodes\":[\"$VERSION_CODE\"],\"status\":\"completed\",\"releaseNotes\":[{\"language\":\"fr-FR\",\"text\":\"Build CI automatisé — commit ${GITHUB_SHA:0:7}, versionCode $VERSION_CODE.\"}]}]}" \
            "$API/edits/$EDIT_ID/tracks/internal")
          echo "$TRACK_RESPONSE"
          if echo "$TRACK_RESPONSE" | grep -q '"error"'; then
            echo "::error::Échec de l'affectation au track internal."
            exit 1
          fi

          echo "4/4 — Commit de l'edit (publication réelle vers Internal Test)…"
          COMMIT_RESPONSE=$(curl -sS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" "$API/edits/$EDIT_ID:commit")
          echo "$COMMIT_RESPONSE"
          if echo "$COMMIT_RESPONSE" | grep -q '"error"'; then
            echo "::error::Échec du commit — l'edit n'a PAS été appliqué."
            exit 1
          fi
          trap - ERR
          echo "OK — versionCode $VERSION_CODE / versionName $VERSION_NAME uploadé et publié sur Internal Test."
          echo "EDIT_ID_COMMITTED=$EDIT_ID" >> "$GITHUB_ENV"

      - name: Verify release is live on Internal Test track
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION_CODE: ${{ steps.validate.outputs.version_code }}
        run: |
          set -e
          PACKAGE="ht.cciga.app"
          API="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/$PACKAGE"
          echo "Ouverture d'un edit de lecture pour confirmer l'état du track internal…"
          READ_EDIT=$(curl -sS -X POST -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" "$API/edits")
          READ_EDIT_ID=$(echo "$READ_EDIT" | grep -oP '"id"\s*:\s*"\K[^"]+')
          TRACK_STATE=$(curl -sS -H "Authorization: Bearer $ACCESS_TOKEN" "$API/edits/$READ_EDIT_ID/tracks/internal")
          echo "$TRACK_STATE"
          curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer $ACCESS_TOKEN" "$API/edits/$READ_EDIT_ID" || true
          if ! echo "$TRACK_STATE" | grep -q "\"$VERSION_CODE\""; then
            echo "::error::versionCode $VERSION_CODE non trouvé sur le track internal après commit."
            exit 1
          fi
          echo "CONFIRMÉ — versionCode $VERSION_CODE est bien live sur Internal Test."

      - name: Upload AAB artifact (also keep a copy in Actions)
        uses: actions/upload-artifact@v4
        with:
          name: cciga-app-internal-test-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
