<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>CCIGA App</title>
<style>
  :root {
    --background: #f5f6f9;
    --foreground: #12213b;
    --primary: #0f2d52;
    --primary-light: #1e4a82;
    --surface: #ffffff;
    --border: #e2e5ea;
    --muted: #5b6478;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--background);
    color: var(--foreground);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 40px;
    max-width: 460px;
    text-align: center;
    box-shadow: 0 8px 28px rgba(15,45,82,.10);
  }
  .icon {
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(179,38,30,.1); color: var(--danger);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700; margin: 0 auto 18px;
  }
  h1 { margin: 0 0 10px; font-size: 18px; font-weight: 700; }
  .detail {
    margin: 0 0 24px; font-size: 12px; color: var(--muted);
    word-break: break-word; line-height: 1.5;
  }
  .actions { display: flex; gap: 10px; justify-content: center; }
  button {
    font: inherit; font-size: 13px; font-weight: 600;
    border-radius: 8px; padding: 10px 18px; cursor: pointer;
    border: 1px solid var(--border);
  }
  .retry { background: var(--primary); color: #fff; border-color: var(--primary); }
  .retry:hover { background: var(--primary-light); }
  .home { background: var(--surface); color: var(--foreground); }
  .home:hover { border-color: var(--primary-light); }
</style>
</head>
<body>
  <div class="panel">
    <div class="icon">!</div>
    <h1 id="message">Impossible de charger CCIGA App</h1>
    <p class="detail" id="detail"></p>
    <div class="actions">
      <button class="retry" id="retry">Réessayer</button>
      <button class="home" id="home">Retour à l'accueil</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("message")) document.getElementById("message").textContent = params.get("message");
    document.getElementById("detail").textContent = params.get("detail") || "";
    document.getElementById("retry").addEventListener("click", () => window.cciga.retryLoad());
    document.getElementById("home").addEventListener("click", () => window.cciga.goHome());
  </script>
</body>
</html>
