apply plugin: 'com.android.application'

// Mandat "Autorisation Phase Internal Test" (2026-09-08) — correction du
// rejet Google Play "bundle non signé" : android-release-aab.yml et
// google-play-internal-test-upload.yml écrivaient déjà keystore.properties
// (racine du projet Gradle, android/) à partir des secrets GitHub, mais ce
// fichier n'était jamais lu — bundleRelease produisait un AAB réellement
// non signé (confirmé : jarsigner -verify -verbose -certs → "no manifest.
// jar is unsigned."). Protégé par un test d'existence pour ne rien casser
// sur android-debug-apk.yml, qui n'écrit jamais ce fichier.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "ht.cciga.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // Identité Production officielle — doit rester alignée avec le
        // namespace ci-dessus et capacitor.config.ts (appId). Mandat
        // "Correction du conflit Application ID" (2026-09-07) : cette valeur
        // avait dérivé vers "ht.cciga.app.test" sans que rien ne le
        // documente ; l'APK de test déjà validé sur appareil réel
        // (test-builds/cciga-app-test-v1.1-2.apk, confirmé via aapt2) et
        // docs/ANDROID_RELEASE_CONFIG.md (2026-08-27) confirment tous deux
        // que "ht.cciga.app" est la valeur historique correcte.
        applicationId "ht.cciga.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode 1 n'a jamais été uploadé sur Google Play mais est déjà
        // "pris" (présent dans ce fichier depuis le début du projet, voir
        // docs/ANDROID_VERSION_HISTORY.md) — mandat "Automatisation Google
        // Play" (2026-09-07) §7 : jamais réutiliser un versionCode, incrémenter
        // avant le premier candidat réellement destiné à un track Google Play.
        // versionCode 2 a été réellement uploadé sur Internal Test le
        // 2026-09-08 (voir docs/ANDROID_VERSION_HISTORY.md) — mandat "Freeze
        // version testeur 1.1" (2026-09-08) : versionCode 3 / versionName
        // "1.1" couvre les Phases C1-C3 (séparation institutionnelle réelle)
        // + les 2 correctifs DEV-BYPASS + le correctif PDF NotoSans italique.
        versionCode 3
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        // DEV/TEST : mécanisme Android standard (applicationIdSuffix sur le
        // buildType debug, déjà utilisé par .github/workflows/android-debug-apk.yml
        // via `assembleDebug`) — produit "ht.cciga.app.test", distinct de la
        // Production "ht.cciga.app" ci-dessus, sans dupliquer aucune config.
        debug {
            applicationIdSuffix ".test"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
